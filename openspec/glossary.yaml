version: "1.0.0"
domain: "Lumina Studio Semantic Media Intelligence"
terms:
  image_facet_taxonomy:
    definition: "Curated categorical schema classifying visual assets across visual_medium, mood, and composition facets."
    sources: ["services/layaClient.js", "public/search.js"]

  pure_transformation:
    definition: "Deterministic mathematical mapping accepting immutable inputs and yielding outputs with zero external side effects or state mutations."
    sources: ["public/search-worker.js", "public/pretext-layout.js"]

  imperative_shell:
    definition: "Outermost execution boundary handling side effects including DOM manipulation, SQLite storage, IPC messaging, and network I/O."
    sources: ["server.js", "main.js", "public/database.js", "public/scope.js"]

  reciprocal_rank_fusion:
    definition: "Hybrid information retrieval algorithm harmonizing disparate rank lists from fuzzy text matching and semantic vector cosine similarity."
    sources: ["public/search-worker.js", "public/search.js"]

  pretext_layout_engine:
    definition: "Reflow-free text measurement engine calculating exact line breaks and card heights purely via mathematical typography buffers."
    sources: ["public/pretext-layout.js"]

  semantic_embedding_vector:
    definition: "Normalized high-dimensional floating-point array encoding multimodal image semantics for nearest-neighbor retrieval."
    sources: ["public/search-worker.js", "public/scope.js"]

  scope_map_projection:
    definition: "Dimensionality reduction rendering pipeline projecting 768-dimensional visual vectors onto a 2D interactive canvas via UMAP."
    sources: ["public/scope.js"]

  duckdb_wasm_bridge:
    definition: "In-browser WebAssembly analytical database engine executing columnar SQL queries over local Parquet and Arrow binary files."
    sources: ["public/scope.js"]

  html_sanitization_pipe:
    definition: "Deterministic pure string replacement filter converting HTML control characters to entity representations to prevent XSS injection."
    sources: ["public/search.js", "public/database.js"]

  can_be_long_protocol:
    definition: "Architecture standard mandating expressive, semantic variable names while strictly prohibiting shorthand abbreviations."
    sources: [".agent/rules/refactor.md", "public/scope.js", "services/layaClient.js"]

  tutorial_protocol:
    definition: "Documentation methodology requiring comprehensive WHAT and WHY explanatory annotations for every logic branch and function."
    sources: [".agent/rules/refactor.md", "services/layaClient.js", "services/localAiClient.js"]

  graphmemory_knowledge_graph:
    definition: "Embedded DuckDB heterogeneous graph model linking Image, Topic, Tag, and Facet nodes through typed relational edges."
    sources: ["scripts/build_graph_memory.py", "scripts/associative_retrieval.py"]

  associative_retrieval_engine:
    definition: "Multi-hop graph traversal engine discovering conceptually resonant assets and cluster bridges via shared concept weighting."
    sources: ["scripts/associative_retrieval.py", "server.js"]

  prompt_dicer_master_record:
    definition: "Immutable structured decomposition binding characters with theta roles, slot-typed ingredients, physical continuity edges, and weighted concreteness metrics."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js"]

  ovis_facet_fallback_enrichment:
    definition: "Confidence-gated slug normalization pipeline filling missing film_stock_or_medium, framing, and mood slots from image_facets while isolating provenance as ovis_facet."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js"]

  visual_grounding_audit:
    definition: "Multimodal cosine-similarity verification comparing cached or live 2048-dimensional Ovis image vectors against caption vectors to classify descriptions into grounded, borderline, or mismatched."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "server.js"]

  evoc_cluster_ingredient_matching:
    definition: "Visual compatibility ranking strategy prioritizing catalog ingredients from shared EVoC image_clusters and Ovis nearest visual neighbors inside the Remix Workbench."
    sources: ["services/promptDicerDb.js", "public/dicer.js"]

  tri_face_prism_card:
    definition: "Three-sided 3D CSS database card cycling across Front Summary, Tags, and Diced Prompt faces while isolating enlarged checkbox hit targets from card rotation."
    sources: ["public/database.js", "public/database.css", "public/database.html"]

  constrained_slot_transplant:
    definition: "Beam-search ingredient swapper replacing up to K unlocked slots with EVoC-ranked, clash-pruned candidates while preserving user-locked subject, pose, action, and lens slots."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "public/dicer.js"]

  ingredient_influence_closure:
    definition: "Bounded Pass D graph resolver auto-pulling implied downstream effects into unlocked slots on ingredient addition and auto-pruning orphaned receivers when their supporting cause is dropped."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "public/dicer.js"]

  round_trip_prompt_verification:
    definition: "Automated verification pass re-dicing assembled prompt prose via offline heuristics or llama-server to detect missing planned slots, dropped anchors, or newly introduced continuity clashes."
    sources: ["services/promptDicerService.js", "server.js", "public/dicer.js"]

  per_ingredient_visual_grounding:
    definition: "Element-wise 2048-dimensional Ovis embedding comparison scoring individual physical anchors against image pixels to enumerate visually missing or ungrounded ingredients."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "public/database.js"]

  laya_confidence_gating:
    definition: "Single-pass Laya /decide evaluation producing slot choice and state implication probabilities to flag low-confidence items for curator review and break remix beam ties."
    sources: ["services/promptDicerService.js", "services/layaClient.js", "server.js"]

  review_event_ledger:
    definition: "Append-only SQLite review_events table recording single-question curator labels alongside model_confidence, model_version, deterministic dataset_split, and quiet repeat-check flags while updating per-item is_reviewed columns."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "public/dicer.js"]

  calibration_histogram_dashboard:
    definition: "Inline SVG analytics view summarizing whole-caption and per-ingredient Ovis score distributions, Laya confidence-vs-accuracy bands, Pass D missing-edge recall estimates, and intra-rater repeat consistency."
    sources: ["services/promptDicerService.js", "services/promptDicerDb.js", "public/dicer.js"]


