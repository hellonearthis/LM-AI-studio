<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database - Image Analysis Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Lumina</h1>
            <div class="sidebar-subtitle">AI Image Analysis</div>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">✨</span> Analysis
            </a>
            <a href="database.html" class="nav-item active">
                <span class="nav-icon">🗄️</span> Database
            </a>
            <a href="search.html" class="nav-item">
                <span class="nav-icon">🔍</span> Search
            </a>
            <a href="tags.html" class="nav-item">
                <span class="nav-icon">🏷️</span> Tags
            </a>
            <a href="scope.html" class="nav-item">
                <span class="nav-icon">🗺️</span> Map <span
                    style="font-size: 0.7em; opacity: 0.7; margin-left: 5px;">(β)</span>
            </a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="container">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Database</h1>
                    <p>View and manage your analyzed images.</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="validateBtn" class="secondary-btn"
                        style="background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <span>🛠️</span> Validate Database
                    </button>
                    <div
                        style="background: var(--card-bg); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border);">
                        <span style="color: var(--text-secondary);">Total Entries:</span>
                        <span id="dbCount"
                            style="font-weight: bold; color: var(--accent); margin-left: 0.5rem;">0</span>
                    </div>
                </div>
            </header>

            <div id="validationStatus"
                style="display: none; background: rgba(52, 211, 153, 0.1); border: 1px solid var(--accent); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; position: relative;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="validationText" style="color: var(--text-primary);">Validating database...</span>
                    <button id="closeStatus"
                        style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem;">&times;</button>
                </div>
                <div id="validationProgress"
                    style="height: 4px; background: var(--border); border-radius: 2px; margin-top: 0.5rem; overflow: hidden;">
                    <div id="validationProgressBar"
                        style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;"></div>
                </div>
            </div>

            <div id="loadingDb" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                Loading database...
            </div>

            <div id="dbGrid" class="analysis-grid">
                <!-- Database entries will be injected here -->
            </div>
        </div>
    </div>

    <script src="database.js"></script>
</body>

</html>
