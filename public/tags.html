<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - Image Analysis Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tags.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Numans&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Lumina</h1>
            <div class="sidebar-subtitle">AI Image Analysis</div>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">✨</span> Analysis
            </a>
            <a href="database.html" class="nav-item">
                <span class="nav-icon">🗄️</span> Database
            </a>
            <a href="search.html" class="nav-item">
                <span class="nav-icon">🔍</span> Search
            </a>
            <a href="tags.html" class="nav-item active">
                <span class="nav-icon">🏷️</span> Tags
            </a>
            <a href="scope.html" class="nav-item">
                <span class="nav-icon">🗺️</span> Map <span
                    style="font-size: 0.7em; opacity: 0.7; margin-left: 5px;">(β)</span>
            </a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="container tags-container" style="max-width: 100%; padding: 2rem;">
            <!-- Header & Controls -->
            <div class="tags-header-section">
                <h2 class="tags-title">Tags & Objects</h2>
                <p>Explore your image collection through extracted metadata.</p>

                <div class="card tags-controls-card">
                    <div class="tags-controls-row">

                        <!-- Tabs -->
                        <div class="tabs-container">
                            <button id="tabTags" class="tab-btn active" onclick="switchTab('tags')">Tags (<span
                                    id="tagsCount">0</span>)</button>
                            <button id="tabObjects" class="tab-btn" onclick="switchTab('objects')">Objects (<span
                                    id="objectsCount">0</span>)</button>
                        </div>

                        <!-- Search & Sort -->
                        <div class="tags-actions-area">
                            <input type="text" id="tagSearch" placeholder="Filter tags..." class="tag-search-input">

                            <select id="sortMethod" onchange="renderCurrentView()" class="tag-sort-select">
                                <option value="count" class="tag-sort-option">
                                    Most Frequent</option>
                                <option value="name" class="tag-sort-option">
                                    Alphabetical</option>
                            </select>

                            <div class="view-toggles">
                                <button class="view-btn active" id="viewCloud" onclick="switchView('cloud')"
                                    title="Cloud View">☁️</button>
                                <button class="view-btn" id="viewList" onclick="switchView('list')"
                                    title="List View">≣</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Alphabet Navigation (shown only in alphabetical list view) -->
            <div id="alphabetNav" class="alphabet-nav">
                <!-- Populated by JS -->
            </div>

            <!-- Content Area -->
            <div id="contentArea" class="cloud-view">
                <!-- Content will be injected here -->
                <div class="loading-message">Loading...</div>
            </div>

        </div>
    </div>

    <script src="tags.js"></script>
</body>

</html>
